version: 2

sources:
  - name: raw_ecommerce
    database: ECOMMERCE_ANALYTICS
    schema: RAW
    tables:
      - name: raw_orders
        description: "Raw order records landed from the mock e-commerce API, one row per order, payload stored as VARIANT."
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}
        columns:
          - name: order_id
            description: "Primary key from the source system."
            tests:
              - unique
              - not_null